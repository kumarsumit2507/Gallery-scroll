<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Scroll</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        style="color: whitesmoke;">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

</head>

<body>
    <div class="gallery-wrap">
        <img src="https://img.icons8.com/badges/48/long-arrow-left.png" class="scroll-button" id="backbtn" alt="long-arrow-left" />
        <div class="gallery" id="gallery">
            <div class="image-container">
                <span><img src="/assets/1.jpg" alt=""></span>
                <span><img src="/assets/2.jpg" alt=""></span>
                <span><img src="/assets/3.jpg" alt=""></span>
            </div>
            <div class="image-container">
                <span><img src="/assets/4.jpg" alt=""></span>
                <span><img src="/assets/5.jpg" alt=""></span>
                <span><img src="/assets/6.jpg" alt=""></span>
            </div>
            <div class="image-container">
                <span><img src="/assets/7.jpg" alt=""></span>
                <span><img src="/assets/8.jpg" alt=""></span>
                <span><img src="/assets/9.jpg" alt=""></span>
            </div>
        </div>
        <img src="https://img.icons8.com/badges/48/long-arrow-right.png" class="scroll-button" id="forwardbtn" alt="long-arrow-right" />
    </div>
    <script src="script.js"></script>
</body>

</html>
